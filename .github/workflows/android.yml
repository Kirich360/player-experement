        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RainyPlayer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
