name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/filesystem@6 @capacitor/share@6 jszip@3.10.1
          cp node_modules/jszip/dist/jszip.min.js www/jszip.min.js
          npx cap init "Rainy: Audio player" com.rainy.player --web-dir www
          python3 - <<'PY'
          import json
          c=json.load(open('capacitor.config.json'))
          c['android']={'backgroundColor':'#0b0714'}
          json.dump(c,open('capacitor.config.json','w'),indent=2)
          PY
          npx cap add android
      - name: Android patch (service, permissions)
        run: |
          D=android/app/src/main/java/com/rainy/player
          cat > $D/MainActivity.java <<'EOF'
          package com.rainy.player;
          import android.os.Bundle;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.IntentSenderRequest;
          import androidx.activity.result.contract.ActivityResultContracts;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            public ActivityResultLauncher<IntentSenderRequest> delL = registerForActivityResult(
              new ActivityResultContracts.StartIntentSenderForResult(), r -> BgPlugin.deleted(r.getResultCode() == RESULT_OK));
            @Override public void onCreate(Bundle b) {
              registerPlugin(BgPlugin.class);
              super.onCreate(b);
              getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
            }
            @Override public void onPause() {
              super.onPause();
              getBridge().getWebView().onResume();
              getBridge().getWebView().resumeTimers();
            }
          }
          EOF
          cat > $D/BgPlugin.java <<'EOF'
          package com.rainy.player;
          import android.Manifest;
          import android.app.PendingIntent;
          import android.graphics.Bitmap;
          import android.media.MediaMetadataRetriever;
          import androidx.activity.result.IntentSenderRequest;
          import java.io.ByteArrayOutputStream;
          import java.util.ArrayList;
          import java.util.List;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.database.ContentObserver;
          import android.database.Cursor;
          import android.graphics.BitmapFactory;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.WindowManager;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          @CapacitorPlugin(name = "Bg", permissions = {
            @Permission(alias = "audio", strings = {Manifest.permission.READ_EXTERNAL_STORAGE}),
            @Permission(alias = "audio13", strings = {Manifest.permission.READ_MEDIA_AUDIO})
          })
          public class BgPlugin extends Plugin {
            static BgPlugin I;
            static void deleted(boolean ok) {
              if (I == null) return;
              JSObject o = new JSObject();
              o.put("ok", ok);
              I.notifyListeners("deleted", o);
            }
            private boolean obs = false;
            static void emit(String a, long p) {
              if (I == null) return;
              JSObject o = new JSObject();
              o.put("a", a);
              o.put("p", p);
              I.notifyListeners("act", o);
            }
            @Override public void load() {
              I = this;
              getContext().registerReceiver(new BroadcastReceiver() {
                @Override public void onReceive(Context c, Intent i) { notifyListeners("noisy", new JSObject()); }
              }, new IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY));
            }
            private String alias() { return Build.VERSION.SDK_INT >= 33 ? "audio13" : "audio"; }
            @PluginMethod public void scan(PluginCall call) {
              if (getPermissionState(alias()) != PermissionState.GRANTED) { requestPermissionForAlias(alias(), call, "permDone"); return; }
              doScan(call);
            }
            @PermissionCallback private void permDone(PluginCall call) {
              if (getPermissionState(alias()) == PermissionState.GRANTED) doScan(call); else call.reject("denied");
            }
            private void doScan(PluginCall call) {
              try {
                JSArray arr = new JSArray();
                Uri u = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                String[] pr = {MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.DURATION, MediaStore.Audio.Media.DISPLAY_NAME, MediaStore.Audio.Media.DATE_ADDED};
                String sel = MediaStore.Audio.Media.IS_RINGTONE + "=0 AND " + MediaStore.Audio.Media.IS_NOTIFICATION + "=0 AND " + MediaStore.Audio.Media.IS_ALARM + "=0";
                if (Build.VERSION.SDK_INT >= 29) {
                  String rp = MediaStore.Audio.Media.RELATIVE_PATH;
                  sel += " AND (" + rp + " IS NULL OR (" + rp + " NOT LIKE '%Recordings%' AND " + rp + " NOT LIKE '%Voice%' AND " + rp + " NOT LIKE 'Android/%'))";
                }
                Cursor cu = getContext().getContentResolver().query(u, pr, sel, null, MediaStore.Audio.Media.DATE_ADDED + " DESC");
                if (cu != null) {
                  while (cu.moveToNext()) {
                    JSObject o = new JSObject();
                    long id = cu.getLong(0);
                    String ar = cu.getString(2);
                    o.put("id", id);
                    o.put("uri", ContentUris.withAppendedId(u, id).toString());
                    o.put("title", cu.getString(1));
                    o.put("artist", "<unknown>".equals(ar) ? "" : ar);
                    o.put("dur", cu.getLong(3));
                    o.put("file", cu.getString(4));
                    o.put("added", cu.getLong(5));
                    arr.put(o);
                  }
                  cu.close();
                }
                if (!obs) {
                  obs = true;
                  getContext().getContentResolver().registerContentObserver(u, true, new ContentObserver(new Handler(Looper.getMainLooper())) {
                    @Override public void onChange(boolean s) { notifyListeners("lib", new JSObject()); }
                  });
                }
                JSObject r = new JSObject();
                r.put("items", arr);
                r.put("sdk", Build.VERSION.SDK_INT);
                call.resolve(r);
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod public void art(PluginCall call) {
              JSObject res = new JSObject();
              res.put("data", "");
              MediaMetadataRetriever r = new MediaMetadataRetriever();
              try {
                int size = call.getInt("size", 160);
                r.setDataSource(getContext(), Uri.parse(call.getString("uri", "")));
                byte[] b = r.getEmbeddedPicture();
                if (b != null) {
                  android.graphics.BitmapFactory.Options o = new android.graphics.BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeByteArray(b, 0, b.length, o);
                  int s = 1;
                  while (o.outWidth / (s * 2) >= size && o.outHeight / (s * 2) >= size) s *= 2;
                  o = new android.graphics.BitmapFactory.Options();
                  o.inSampleSize = s;
                  Bitmap bm = BitmapFactory.decodeByteArray(b, 0, b.length, o);
                  if (bm != null) {
                    int m = Math.min(bm.getWidth(), bm.getHeight());
                    Bitmap sq = Bitmap.createBitmap(bm, (bm.getWidth() - m) / 2, (bm.getHeight() - m) / 2, m, m);
                    int t = Math.min(size, m);
                    Bitmap out = Bitmap.createScaledBitmap(sq, t, t, true);
                    ByteArrayOutputStream bo = new ByteArrayOutputStream();
                    out.compress(Bitmap.CompressFormat.JPEG, 78, bo);
                    res.put("data", Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                  }
                }
              } catch (Exception e) {}
              try { r.release(); } catch (Exception e) {}
              call.resolve(res);
            }
            @PluginMethod public void remove(PluginCall call) {
              try {
                if (Build.VERSION.SDK_INT < 30) { call.reject("sdk"); return; }
                JSArray a = call.getArray("uris");
                List<Uri> us = new ArrayList<>();
                for (int i = 0; i < a.length(); i++) us.add(Uri.parse(a.getString(i)));
                PendingIntent pi = MediaStore.createDeleteRequest(getContext().getContentResolver(), us);
                ((MainActivity) getActivity()).delL.launch(new IntentSenderRequest.Builder(pi.getIntentSender()).build());
                call.resolve();
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod public void notif(PluginCall call) {
              if (Build.VERSION.SDK_INT >= 33 && getContext().checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                getActivity().requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 77);
              call.resolve();
            }
            @PluginMethod public void start(PluginCall call) {
              try { ContextCompat.startForegroundService(getContext(), new Intent(getContext(), PlayerService.class)); } catch (Exception e) {}
              call.resolve();
            }
            @PluginMethod public void stop(PluginCall call) {
              getContext().stopService(new Intent(getContext(), PlayerService.class));
              call.resolve();
            }
            @PluginMethod public void update(PluginCall c) {
              PlayerService.T = c.getString("title", "Rainy: Audio player");
              PlayerService.A = c.getString("artist", "");
              PlayerService.P = Boolean.TRUE.equals(c.getBoolean("playing", false));
              PlayerService.F = Boolean.TRUE.equals(c.getBoolean("fav", false));
              PlayerService.L = !Boolean.FALSE.equals(c.getBoolean("lock", true));
              PlayerService.EN = "en".equals(c.getString("lang", "ru"));
              PlayerService.POS = (long) (double) c.getDouble("pos", 0.0);
              PlayerService.DUR = (long) (double) c.getDouble("dur", 0.0);
              PlayerService.SPD = (float) (double) c.getDouble("spd", 1.0);
              if (c.hasOption("cover")) {
                PlayerService.ART = null;
                String s = c.getString("cover", "");
                if (s != null && !s.isEmpty()) {
                  try { byte[] b = Base64.decode(s, Base64.DEFAULT); PlayerService.ART = BitmapFactory.decodeByteArray(b, 0, b.length); } catch (Exception e) {}
                }
              }
              PlayerService.push();
              c.resolve();
            }
            @PluginMethod public void nativePlay(PluginCall call) {
              try {
                JSArray items = call.getArray("items");
                int index = call.getInt("index", 0);
                long position = (long) (double) call.getDouble("position", 0.0);
                float speed = (float) call.getDouble("speed", 1.0);
                float volume = (float) call.getDouble("volume", 1.0);
                Intent i = new Intent(getContext(), PlayerService.class).setAction("NATIVE_PLAY_QUEUE");
                i.putExtra("queue", items == null ? "[]" : items.toString());
                i.putExtra("index", index); i.putExtra("position", position);
                i.putExtra("speed", speed); i.putExtra("volume", volume);
                i.putExtra("shuffle", Boolean.TRUE.equals(call.getBoolean("shuffle", false)));
                i.putExtra("repeat", call.getInt("repeat", 0));
                ContextCompat.startForegroundService(getContext(), i);
                call.resolve();
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod public void nativeCommand(PluginCall call) {
              try {
                String a = call.getString("action", "");
                Intent i = new Intent(getContext(), PlayerService.class).setAction("NATIVE_" + a.toUpperCase(java.util.Locale.ROOT));
                if (call.hasOption("position")) i.putExtra("position", (long) (double) call.getDouble("position", 0.0));
                if (call.hasOption("value")) i.putExtra("value", call.getDouble("value", 0.0));
                ContextCompat.startForegroundService(getContext(), i);
                call.resolve();
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod public void awake(PluginCall call) {
              final boolean on = Boolean.TRUE.equals(call.getBoolean("on", false));
              getActivity().runOnUiThread(() -> {
                if (on) getActivity().getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                else getActivity().getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              });
              call.resolve();
            }
          }
          EOF
          cat > $D/PlayerService.java <<'EOF'
          package com.rainy.player;
          import android.app.*;
          import android.content.*;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.drawable.Icon;
          import androidx.media3.common.AudioAttributes;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.*;
          import android.net.Uri;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.exoplayer.ExoPlayer;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.List;
          public class PlayerService extends Service {
          static PlayerService S;
          static String T = "Rainy: Audio player", A = "";
          static boolean P = false, F = false, L = true, EN = false;
          static long POS = 0, DUR = 0;
          static float SPD = 1f;
          static Bitmap ART = null;
          private PowerManager.WakeLock wl;
          private MediaSession ms;
          private ExoPlayer player;
          private final Handler h = new Handler(Looper.getMainLooper());
          private final List<JSONObject> queue = new ArrayList<>();
          private Runnable ticker, sleepTask;
          private float baseVolume = 1f;
          private int repeatMode = 0;
          private static final int NOTIF = 1;
          static void push() { if (S != null) S.apply(); }
          static void command(String action, long position, double value) {
          if (S != null) S.handleNative(action, position, value);
          }
          @Override public IBinder onBind(Intent i) { return null; }
          @Override public void onCreate() {
          super.onCreate(); S = this;
          player = new ExoPlayer.Builder(this).build();
          player.setAudioAttributes(new AudioAttributes.Builder().setUsage(androidx.media3.common.C.USAGE_MEDIA).setContentType(androidx.media3.common.C.AUDIO_CONTENT_TYPE_MUSIC).build(), true);
          player.addListener(new Player.Listener() {
          @Override public void onIsPlayingChanged(boolean playing) { P = playing; publish(); apply(); }
          @Override public void onMediaItemTransition(MediaItem item, int reason) { updateMeta(); publish(); apply(); }
          @Override public void onPlaybackStateChanged(int state) { if (state == Player.STATE_ENDED) { P=false; publish(); } else publish(); apply(); }
          @Override public void onPlayerError(PlaybackException e) { P=false; publish(); apply(); }
          });
          ms = new MediaSession(this, "Rainy");
          ms.setCallback(new MediaSession.Callback() {
          @Override public void onPlay() { handleNative("play", 0, 0); }
          @Override public void onPause() { handleNative("pause", 0, 0); }
          @Override public void onSkipToNext() { handleNative("next", 0, 0); }
          @Override public void onSkipToPrevious() { handleNative("prev", 0, 0); }
          @Override public void onSeekTo(long p) { handleNative("seek", p, 0); }
          @Override public void onCustomAction(String a, Bundle e) { BgPlugin.emit(a, 0); }
          });
          ms.setActive(true);
          if (Build.VERSION.SDK_INT >= 26) getSystemService(NotificationManager.class).createNotificationChannel(new NotificationChannel("rp", java.util.Locale.getDefault().getLanguage().equals("ru") ? "Воспроизведение" : "Playback", NotificationManager.IMPORTANCE_LOW));
          ticker = new Runnable() { @Override public void run() { if (player != null) { POS=player.getCurrentPosition(); DUR=Math.max(0,player.getDuration()); P=player.isPlaying(); SPD=player.getPlaybackParameters().speed; publish(); apply(); h.postDelayed(this, 1000); } } };
          h.post(ticker);
          }
          private Notification.Action act(String a, int icon, String label) {
          PendingIntent pi = PendingIntent.getService(this, a.hashCode(), new Intent(this, PlayerService.class).setAction("NATIVE_" + a.toUpperCase(java.util.Locale.ROOT)), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
          return new Notification.Action.Builder(Icon.createWithResource(this, icon), label, pi).build();
          }
          private void updateMeta() {
          int ix = player == null ? -1 : player.getCurrentMediaItemIndex();
          if (ix >= 0 && ix < queue.size()) { JSONObject o=queue.get(ix); T=o.optString("title", "Rainy: Audio player"); A=o.optString("artist", ""); }
          POS=player == null ? 0 : player.getCurrentPosition(); DUR=player == null || player.getDuration()<0 ? 0 : player.getDuration();
          }
          private void publish() {
          if (player == null) return;
          updateMeta(); P=player.isPlaying();
          if (ms != null) {
          MediaMetadata.Builder m = new MediaMetadata.Builder().putString(MediaMetadata.METADATA_KEY_TITLE,T).putString(MediaMetadata.METADATA_KEY_ARTIST,A).putLong(MediaMetadata.METADATA_KEY_DURATION,DUR);
          if (ART != null) m.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, ART);
          ms.setMetadata(m.build());
          ms.setPlaybackState(new PlaybackState.Builder().setActions(PlaybackState.ACTION_PLAY|PlaybackState.ACTION_PAUSE|PlaybackState.ACTION_PLAY_PAUSE|PlaybackState.ACTION_SKIP_TO_NEXT|PlaybackState.ACTION_SKIP_TO_PREVIOUS|PlaybackState.ACTION_SEEK_TO)
          .addCustomAction(new PlaybackState.CustomAction.Builder("fav", F ? (EN?"Remove from favorites":"Убрать из избранного") : (EN?"Add to favorites":"В избранное"), F?android.R.drawable.btn_star_big_on:android.R.drawable.btn_star_big_off).build())
          .setState(P?PlaybackState.STATE_PLAYING:(player.getPlaybackState()==Player.STATE_ENDED?PlaybackState.STATE_STOPPED:PlaybackState.STATE_PAUSED),POS,P?SPD:0f,SystemClock.elapsedRealtime()).build());
          }
          try { if (BgPlugin.I != null) { org.json.JSONObject o=new org.json.JSONObject(); o.put("index", player.getCurrentMediaItemIndex()); o.put("position",POS); o.put("duration",DUR); o.put("playing",P); o.put("speed",SPD); o.put("title",T); o.put("artist",A);
              if(player.getCurrentMediaItem()!=null && player.getCurrentMediaItem().localConfiguration!=null) o.put("currentUri",player.getCurrentMediaItem().localConfiguration.uri.toString());
              JSONArray qa=new JSONArray(); for(JSONObject item:queue) qa.put(item.optString("uri", "")); o.put("queue",qa);
              BgPlugin.I.notifyListeners("nativeState", new com.getcapacitor.JSObject(o.toString())); } } catch(Exception e) {}
          }
          void apply() {
          if (player != null) { P=player.isPlaying(); POS=player.getCurrentPosition(); DUR=player.getDuration()<0?0:player.getDuration(); }
          try {
          publish();
          Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this,"rp") : new Notification.Builder(this);
          Intent o = new Intent(this, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP|Intent.FLAG_ACTIVITY_NEW_TASK);
          b.setSmallIcon(android.R.drawable.ic_media_play).setContentTitle(T).setContentText(A.isEmpty()?"Rainy: Audio player":A).setOngoing(P).setVisibility(L?Notification.VISIBILITY_PUBLIC:Notification.VISIBILITY_SECRET)
          .setContentIntent(PendingIntent.getActivity(this,0,o,PendingIntent.FLAG_IMMUTABLE))
          .addAction(act("prev",android.R.drawable.ic_media_previous,EN?"Previous":"Назад"))
          .addAction(act("toggle",P?android.R.drawable.ic_media_pause:android.R.drawable.ic_media_play,P?(EN?"Pause":"Пауза"):(EN?"Play":"Играть")))
          .addAction(act("next",android.R.drawable.ic_media_next,EN?"Next":"Дальше"))
          .addAction(act("fav",F?android.R.drawable.btn_star_big_on:android.R.drawable.btn_star_big_off,EN?"Favorite":"Избранное"))
          .setStyle(new Notification.MediaStyle().setMediaSession(ms.getSessionToken()).setShowActionsInCompactView(0,1,2));
          if (ART != null) b.setLargeIcon(ART);
          Notification n=b.build();
          if (Build.VERSION.SDK_INT>=29) startForeground(NOTIF,n,ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK); else startForeground(NOTIF,n);
          if (wl==null) wl=((PowerManager)getSystemService(POWER_SERVICE)).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK,"rainy:play");
          if (P&&!wl.isHeld()) wl.acquire(); if (!P&&wl.isHeld()) wl.release();
          } catch(Exception e) {}
          }
          private void startQueue(Intent i) {
          try {
          queue.clear(); JSONArray a=new JSONArray(i.getStringExtra("queue"));
          List<MediaItem> media=new ArrayList<>();
          for(int n=0;n<a.length();n++){JSONObject o=a.getJSONObject(n);queue.add(o);String uri=o.getString("uri");
          androidx.media3.common.MediaMetadata md=new androidx.media3.common.MediaMetadata.Builder().setTitle(o.optString("title", "Rainy: Audio player")).setArtist(o.optString("artist", "")).build();
          media.add(new MediaItem.Builder().setUri(Uri.parse(uri)).setMediaMetadata(md).build()); }
          if(media.isEmpty()) return;
          player.setMediaItems(media); int ix=Math.max(0,Math.min(i.getIntExtra("index",0),media.size()-1));
          player.prepare(); player.seekTo(ix,Math.max(0,i.getLongExtra("position",0)));
          SPD=Math.max(.3f,Math.min(3f,i.getFloatExtra("speed",1f))); player.setPlaybackParameters(new androidx.media3.common.PlaybackParameters(SPD));
          baseVolume=Math.max(0f,Math.min(1f,i.getFloatExtra("volume",1f))); player.setVolume(baseVolume); player.play(); updateMeta(); apply();
          } catch(Exception e) { stopSelf(); }
          }
          private void handleNative(String action,long position,double value) {
          if(player==null) return;
          switch(action) {
          case "play": player.play(); break;
          case "pause": player.pause(); break;
          case "toggle": if(player.isPlaying())player.pause();else player.play(); break;
          case "next": if(player.hasNextMediaItem())player.seekToNextMediaItem();else if(repeatMode!=0&&!queue.isEmpty())player.seekTo(0,0);break;
          case "prev": if(player.getCurrentPosition()>3000)player.seekTo(0);else if(player.hasPreviousMediaItem())player.seekToPreviousMediaItem();else if(repeatMode!=0&&!queue.isEmpty())player.seekTo(queue.size()-1,0);break;
          case "seek": player.seekTo(Math.max(0,position)); break;
          case "speed": SPD=(float)Math.max(.3,Math.min(3,value));player.setPlaybackParameters(new androidx.media3.common.PlaybackParameters(SPD));break;
          case "volume": baseVolume=(float)Math.max(0,Math.min(1,value));player.setVolume(baseVolume);break;
          case "shuffle": player.setShuffleModeEnabled(value>0);break;
          case "repeat": repeatMode=Math.max(0,Math.min(2,(int)value));player.setRepeatMode(repeatMode==2?Player.REPEAT_MODE_ONE:(repeatMode==1?Player.REPEAT_MODE_ALL:Player.REPEAT_MODE_OFF));break;
          case "stop": player.pause();player.clearMediaItems();queue.clear();P=false;stopForeground(false);stopSelf();break;
          case "sleep": scheduleSleep(position);break;
          case "fav": BgPlugin.emit("fav",0);break;
          }
          publish();apply();
          }
          private void scheduleSleep(long ms) {
          if(sleepTask!=null)h.removeCallbacks(sleepTask);
          player.setVolume(baseVolume);
          if(ms<=0)return;
          final long deadline=SystemClock.elapsedRealtime()+ms;
          sleepTask=new Runnable(){@Override public void run(){long left=deadline-SystemClock.elapsedRealtime();if(left<=0){player.pause();player.setVolume(baseVolume);sleepTask=null;apply();return;} if(left<10000)player.setVolume(baseVolume*Math.max(0f,left/10000f));h.postDelayed(this,250);}};
          h.postDelayed(sleepTask,250);
          }
          @Override public int onStartCommand(Intent i,int flags,int id) {
          String a=i==null?null:i.getAction();
          if("NATIVE_PLAY_QUEUE".equals(a)){startQueue(i);return START_STICKY;}
          if(a!=null&&a.startsWith("NATIVE_")){String cmd=a.substring(7).toLowerCase(java.util.Locale.ROOT);handleNative(cmd,i.getLongExtra("position",0),i.getDoubleExtra("value",0));return START_STICKY;}
          apply(); return START_STICKY;
          }
          @Override public void onTaskRemoved(Intent i) { if(player==null||!player.isPlaying()) { stopForeground(false); stopSelf(); } }
          @Override public void onDestroy() {
          h.removeCallbacksAndMessages(null); if(wl!=null&&wl.isHeld())wl.release(); if(player!=null)player.release(); if(ms!=null)ms.release(); S=null; super.onDestroy();
          }
          }
          EOF
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perm=''.join('<uses-permission android:name="android.permission.%s"/>\n'%n for n in ['FOREGROUND_SERVICE','FOREGROUND_SERVICE_MEDIA_PLAYBACK','POST_NOTIFICATIONS','WAKE_LOCK','READ_MEDIA_AUDIO','READ_EXTERNAL_STORAGE'])
          s=s.replace('</manifest>',perm+'</manifest>')
          s=s.replace('</application>','<service android:name=".PlayerService" android:foregroundServiceType="mediaPlayback" android:exported="false"/>\n</application>')
          open(p,'w').write(s)
          PY
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          npx cap sync android
          python3 - <<'PYDEP'
          p='android/app/build.gradle'
          s=open(p).read()
          dep="implementation 'androidx.media3:media3-exoplayer:1.5.1'"
          if dep not in s:
              s=s.replace('dependencies {', 'dependencies {\n    '+dep, 1)
          open(p,'w').write(s)
          PYDEP
      - name: App icon
        run: |
          if [ -f icon.png ]; then
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os, glob
          im = Image.open('icon.png').convert('RGBA')
          w, h = im.size
          m = min(w, h)
          l = (w - m) // 2
          t = (h - m) // 2
          im = im.crop((l, t, l + m, t + m))
          res = 'android/app/src/main/res'
          for f in glob.glob(res + '/mipmap-*/ic_launcher*.webp'):
              os.remove(f)
          for d, k in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              p = res + '/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              s = int(48 * k)
              a = im.resize((s, s), Image.LANCZOS)
              a.save(p + '/ic_launcher.png')
              mk = Image.new('L', (s, s), 0)
              ImageDraw.Draw(mk).ellipse((0, 0, s - 1, s - 1), fill=255)
              r = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              r.paste(a, (0, 0), mk)
              r.save(p + '/ic_launcher_round.png')
              b = int(108 * k)
              im.resize((b, b), Image.LANCZOS).save(p + '/rayni_bg.png')
              Image.new('RGBA', (b, b), (0, 0, 0, 0)).save(p + '/rayni_fg.png')
          x = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n<background android:drawable="@mipmap/rayni_bg"/>\n<foreground android:drawable="@mipmap/rayni_fg"/>\n</adaptive-icon>\n'
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(res + '/mipmap-anydpi-v26/' + n + '.xml', 'w').write(x)
          PY
          fi
